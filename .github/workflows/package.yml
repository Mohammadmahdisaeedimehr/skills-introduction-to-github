name: package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install editable package with dev tools
        run: python -m pip install -e ".[dev]"
      - name: Type check
        run: python -m mypy
      - name: Test
        run: python -m pytest -q
      - name: Smoke test console script
        run: user-summary user_summary.txt
