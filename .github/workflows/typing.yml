name: typing

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run mypy
        run: python -m mypy
      - name: Run pytest
        run: python -m pytest -q
